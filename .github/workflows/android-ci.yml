name: AXIOM Launcher Android CI

on:
  push:
    branches:
      - main
      - fix/p1-core-reliability
      - feat/release-visual-overhaul
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Validate VOID.SYS assets
        run: |
          python3 -m unittest discover -s app/tools -p 'test_*.py'
          python3 app/tools/voidsys_qa.py --output "$RUNNER_TEMP/voidsys-qa"

      - name: Build, test, and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin --no-daemon --max-workers=2 --console=plain --stacktrace

      - name: Verify shrunk VOID.SYS resources
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/release-resources.txt"
          python3 app/tools/voidsys_qa.py --resource-dump "$RUNNER_TEMP/release-resources.txt" --output "$RUNNER_TEMP/voidsys-release-qa"

      - name: Verify native page alignment
        run: |
          python3 app/tools/release_native_qa.py --apk app/build/outputs/apk/debug/app-debug.apk
          python3 app/tools/release_native_qa.py --apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
